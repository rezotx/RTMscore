[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtmscore"
version = "1.0.0"
description = "RTMScore: A novel scoring function based on residue-atom distance likelihood potential and graph transformer for protein-ligand interactions."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Chao Shen"},
]
dependencies = [
    "torch>=2.2.1,<2.3",
    "torch_geometric>=2.4",
    "numpy>=1.26,<2",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "rdkit>=2024.3",
    "MDAnalysis>=2.6",
    "prody>=2.4",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openbabel = [
    "openbabel-wheel>=3.1",
]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/sc8668/RTMScore"

[tool.setuptools.packages.find]
include = ["RTMScore*"]

[tool.setuptools.package-data]
RTMScore = ["py.typed"]
